2/users/\&quot;,\n  headers: {\n    Authorization: &#x27;Bearer 3260e4bb2c95687541c997231ee95646ff0d767415fad82d5ff8c11d145d1431&#x27;,\n    &#x27;Content-Type&#x27;: &#x27;application/json&#x27;\n  },\n  // getting data from fixtures file\n  body: {\n    name: rendumtext,\n    email: textemail,\n    gender: \&quot;male\&quot;,\n    status: \&quot;active\&quot;\n  }\n}).then(res =&gt; {\n  cy.log(JSON.stringify(res));\n  expect(res.status).to.equal(201);\n  expect(res.body).to.have.property(&#x27;id&#x27;);\n  expect(res.body.name).to.equal(rendumtext);\n  expect(res.body.gender).to.equal(\&quot;male\&quot;);\n  // eleting userID\n  const userID = res.body.id;\n  cy.log(\&quot;user id is : \&quot; + userID);\n  // delete user\n  cy.request({\n    method: &#x27;DELETE&#x27;,\n    url: &#x27;https://gorest.co.in/public/v1/users/&#x27; + userID,\n    headers: {\n      Authorization: &#x27;Bearer 3260e4bb2c95687541c997231ee95646ff0d767415fad82d5ff8c11d145d1431&#x27;\n    }\n  }).then(res =&gt; {\n    expect(res.status).to.eq(204);\n    //getting user\n    cy.request({\n      method: &#x27;GET&#x27;,\n      url: &#x27;https://gorest.co.in/public/v1/users/&#x27; + userID,\n      failOnStatusCode: false,\n      headers: {\n        Authorization: &#x27;Bearer 3260e4bb2c95687541c997231ee95646ff0d767415fad82d5ff8c11d145d1431&#x27;\n      }\n    }).then(res =&gt; {\n      expect(res.body.data).has.property(&#x27;message&#x27;, &#x27;Resource not found&#x27;);\n    });\n  });\n});&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;45ba1a64-ca2b-4e5e-ae53-443510ea5092&quot;,&quot;parentUUID&quot;:&quot;e9570d06-05bd-46ec-9910-e517137db98a&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false}],&quot;suites&quot;:[],&quot;passes&quot;:[&quot;45ba1a64-ca2b-4e5e-ae53-443510ea5092&quot;],&quot;failures&quot;:[],&quot;pending&quot;:[],&quot;skipped&quot;:[],&quot;duration&quot;:8611,&quot;root&quot;:false,&quot;rootEmpty&quot;:false,&quot;_timeout&quot;:2000}],&quot;passes&quot;:[],&
